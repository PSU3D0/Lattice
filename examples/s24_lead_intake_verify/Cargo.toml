[package]
name = "example-s24-lead-intake-verify"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S24 clone (n8n template #8): a webhook lead-intake form that verifies the email with Hunter, then fans a valid lead into Google Sheets, Gmail, and a Discord webhook."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_hunter = { path = "../../crates/connectors/hunter", default-features = false }
connector_discord = { path = "../../crates/connectors/discord", default-features = false }
connector_google_sheets = { path = "../../crates/connectors/google/sheets", default-features = false }
connector_google_gmail = { path = "../../crates/connectors/google/gmail", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait = { workspace = true }
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_hunter/host-bundle",
    "connector_discord/host-bundle",
    "connector_google_sheets/host-bundle",
    "connector_google_gmail/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s24_lead_intake_verify_flow"]
default_flow = "s24_lead_intake_verify_flow"
