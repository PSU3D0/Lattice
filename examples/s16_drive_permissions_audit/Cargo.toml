[package]
name = "example-s16-drive-permissions-audit"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S16 pilot clone: a daily scheduled Google Drive sharing audit — search recently modified files, flag public/externally shared ones, log rows to a dated sheet tab, and email a report; all effectful payloads keyed on the fire's scheduled_time_ms."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_google_drive = { path = "../../crates/connectors/google/drive", default-features = false }
connector_google_gmail = { path = "../../crates/connectors/google/gmail", default-features = false }
connector_google_sheets = { path = "../../crates/connectors/google/sheets", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_google_drive/host-bundle",
    "connector_google_gmail/host-bundle",
    "connector_google_sheets/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s16_drive_permissions_audit_flow"]
default_flow = "s16_drive_permissions_audit_flow"
