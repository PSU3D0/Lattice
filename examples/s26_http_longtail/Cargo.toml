[package]
name = "example-s26-http-longtail"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S26 (packet H4): the generic connector.http long-tail acceptance flow — typed Tier-0 GET, pure shape, dedupe-guarded Effectful POST, an Effectful webhook GET (spec §4), and a Tier-2 unauthenticated any-origin GET, plus the normative exactly-once-edge reference."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_http = { path = "../../crates/connectors/http", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
connectors-std = { path = "../../crates/connectors-std" }
dag-core = { path = "../../crates/dag-core" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_http/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s26_http_longtail_flow"]
default_flow = "s26_http_longtail_flow"
