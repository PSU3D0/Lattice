[package]
name = "example-s18-retell-transcript-sink"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S18 clone: a webhook-triggered call-transcript sink — normalize an analyzed-call event and fan it into Airtable, Google Sheets, and Notion; every write and the terminal KV record keyed on the inbound call id."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_airtable = { path = "../../crates/connectors/airtable", default-features = false }
connector_notion = { path = "../../crates/connectors/notion", default-features = false }
connector_google_sheets = { path = "../../crates/connectors/google/sheets", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_airtable/host-bundle",
    "connector_notion/host-bundle",
    "connector_google_sheets/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s18_retell_transcript_sink_flow"]
default_flow = "s18_retell_transcript_sink_flow"
