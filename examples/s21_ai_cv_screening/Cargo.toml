[package]
name = "example-s21-ai-cv-screening"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S21 clone (n8n template #2, AI CV Screening): a webhook application form that scores the resume via connector.llm.complete, appends the candidate to a Google Sheet, and emails both the candidate and HR; the delivery is keyed on the applicant email. Honest subset: the PDF-extraction step is moved to the webhook payload boundary (see the flow docs)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_google_gmail = { path = "../../crates/connectors/google/gmail", default-features = false }
connector_google_sheets = { path = "../../crates/connectors/google/sheets", default-features = false }
connector_llm = { path = "../../crates/connectors/llm/core", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_google_gmail/host-bundle",
    "connector_google_sheets/host-bundle",
    "connector_llm/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s21_ai_cv_screening_flow"]
default_flow = "s21_ai_cv_screening_flow"
