[package]
name = "example-s22-hydration-reminder"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S22 clone of n8n template #3: a webhook-triggered hydration reminder — read the day's intake log from Google Sheets, summarize progress, generate a personalised reminder with an LLM, post it to Slack, and record the delivery keyed on reminder_id."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_google_sheets = { path = "../../crates/connectors/google/sheets", default-features = false }
connector_llm = { path = "../../crates/connectors/llm/core", default-features = false }
connector_slack_core = { path = "../../crates/connectors/slack/core", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_google_sheets/host-bundle",
    "connector_llm/host-bundle",
    "connector_slack_core/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s22_hydration_reminder_flow"]
default_flow = "s22_hydration_reminder_flow"
