[package]
name = "example-s8-contract-surface"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S8 contract export and explicit adapter pathway example."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
capabilities = { path = "../../crates/capabilities" }
kernel-plan = { path = "../../crates/kernel-plan" }
host-inproc = { path = "../../crates/host-inproc" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kernel-exec = { path = "../../crates/kernel-exec" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
kernel-exec = { path = "../../crates/kernel-exec", default-features = false, features = ["wasm"] }

[features]
default = ["host-bundle"]
host-bundle = []
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["child_contract_flow"]
default_flow = "child_contract_flow"
