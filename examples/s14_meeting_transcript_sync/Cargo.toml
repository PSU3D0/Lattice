[package]
name = "example-s14-meeting-transcript-sync"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S14 meeting transcript sync example with a safe example-owned execution seam, example-local D1/R2 adapters, and a thin scheduled-wrapper helper path."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
capabilities = { path = "../../crates/capabilities" }
connector_google_platform = { path = "../../crates/connectors/google/platform" }
connector_zoom_platform = { path = "../../crates/connectors/zoom/platform" }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
hex.workspace = true
kernel-plan = { path = "../../crates/kernel-plan" }
percent-encoding = "2.3"
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
cap-sql-sqlx-sqlite = { path = "../../crates/cap-sql-sqlx-sqlite" }
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cap-sql-workers-d1 = { path = "../../crates/cap-sql-workers-d1" }
worker = { version = "=0.8.1", default-features = false, features = ["http", "d1"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = ["kernel-exec", "host-inproc"]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s14_meeting_transcript_sync_flow"]
default_flow = "s14_meeting_transcript_sync_flow"
