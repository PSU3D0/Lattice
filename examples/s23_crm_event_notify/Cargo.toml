[package]
name = "example-s23-crm-event-notify"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S23 clone (n8n template #4): a webhook CRM-event router that logs every event to a Google Sheet, emails delete events via Gmail and posts all other events to Slack, keyed on the CRM event id."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_google_gmail = { path = "../../crates/connectors/google/gmail", default-features = false }
connector_google_sheets = { path = "../../crates/connectors/google/sheets", default-features = false }
connector_slack_core = { path = "../../crates/connectors/slack/core", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_google_gmail/host-bundle",
    "connector_google_sheets/host-bundle",
    "connector_slack_core/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s23_crm_event_notify_flow"]
default_flow = "s23_crm_event_notify_flow"
