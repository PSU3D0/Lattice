[package]
name = "example-s11-lead-intake"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S11 lead intake flow with explicit AI topology, OpenAI proofing, and workspace artifact persistence."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
llm-agent = { path = "../../crates/llm-agent", features = ["image"] }
llm-lattice = { path = "../../crates/llm-lattice" }
llm-provider-openai = { path = "../../crates/llm-provider-openai" }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
cap-workspace-fs = { path = "../../crates/cap-workspace-fs" }
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
base64 = "0.22"
httpmock = "0.7"

[features]
default = ["host-bundle"]
host-bundle = ["kernel-exec", "host-inproc"]
native-smoke = []
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[[bin]]
name = "live_smoke"
path = "src/bin/live_smoke.rs"
required-features = ["host-bundle", "native-smoke"]

[package.metadata.latticeflow]
flows = ["s11_lead_intake_flow"]
default_flow = "s11_lead_intake_flow"
