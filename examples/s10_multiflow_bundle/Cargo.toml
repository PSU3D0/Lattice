[package]
name = "example-s10-multiflow-bundle"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Minimal multi-flow example used to prove wasm bundle flow selection and invocation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[features]
default = ["host-bundle"]
host-bundle = ["kernel-exec", "host-inproc"]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s10_multiflow_upper_flow", "s10_multiflow_reverse_flow"]
default_flow = "s10_multiflow_upper_flow"
