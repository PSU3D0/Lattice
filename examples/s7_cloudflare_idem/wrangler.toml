# Template-like baseline for this example.
# Replace placeholder IDs before deploy, or copy to a local config and pass --config.
name = "flow-idem-ingest"
main = "workerd-tests/build/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["durable_object_alarms"]

kv_namespaces = [
  { binding = "EVENTS_KV", id = "REPLACE_WITH_EVENTS_KV_ID", preview_id = "REPLACE_WITH_EVENTS_KV_PREVIEW_ID" }
]

[[durable_objects.bindings]]
name = "DEDUP_DO"
class_name = "FlowDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlowDurableObject"]

[vars]
OTEL_EXPORTER_OTLP_ENDPOINT = "https://otel.example.com/v1/traces"
