[package]
name = "example-s27-binary"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "S27 (packet H5d): the connector.http byte-plane acceptance flow — a CSV build→stage→multipart-POST egress round-trip and a get_binary→transform→re-upload ingress round-trip, proving the Artifact handle plane and the workspace read/write effect floors end-to-end through host-inproc."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
capabilities = { path = "../../crates/capabilities" }
connector_http = { path = "../../crates/connectors/http", default-features = false }
dag-core = { path = "../../crates/dag-core" }
dag-macros = { path = "../../crates/dag-macros" }
kernel-plan = { path = "../../crates/kernel-plan" }
serde.workspace = true
serde_json.workspace = true
host-inproc = { path = "../../crates/host-inproc", optional = true }
kernel-exec = { path = "../../crates/kernel-exec", optional = true }

[dev-dependencies]
async-trait.workspace = true
cap-http-reqwest = { path = "../../crates/cap-http-reqwest" }
cap-workspace-fs = { path = "../../crates/cap-workspace-fs" }
dag-core = { path = "../../crates/dag-core" }
httpmock = "0.7"
tempfile = "3"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["host-bundle"]
host-bundle = [
    "kernel-exec",
    "host-inproc",
    "connector_http/host-bundle",
]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[package.metadata.latticeflow]
flows = ["s27_binary_flow"]
default_flow = "s27_binary_flow"
