name = "lattice-pdf-extract"
main = "dist/index.mjs"
compatibility_date = "2026-07-15"
workers_dev = false
preview_urls = false

[build]
command = "npm run build"

[limits]
# Platform CPU policy only. This is not native fuel, epoch interruption,
# StoreLimits, guest CPU observation, or a CPU-vs-memory termination oracle.
cpu_ms = 30000

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
