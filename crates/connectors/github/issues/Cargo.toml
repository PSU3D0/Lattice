[package]
name = "connector_github_issues"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Semantic GitHub issues connector"

[features]
default = ["host-bundle"]
host-bundle = ["dag-macros/host-bundle", "kernel-exec"]

[dependencies]
capabilities = { path = "../../../capabilities" }
dag-core = { path = "../../../dag-core" }
dag-macros = { path = "../../../dag-macros" }
kernel-exec = { path = "../../../kernel-exec", optional = true }
connectors-std = { path = "../../../connectors-std" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cap-http-reqwest = { path = "../../../cap-http-reqwest" }
connector-spec = { path = "../../../connector-spec" }
httpmock = "0.7"
testing-harness-idem = { path = "../../../testing-harness-idem" }
tokio = { workspace = true, features = ["full"] }
