connector:
  id: connector.google.sheets
  vendor: google
  family: sheets
  version: 0.1.0
  crate: connector_google_sheets
  summary: Semantic Google Sheets connector

profiles:
  outbound_auth:
    google_workspace_auth:
      kind: bearer
      handle_kind: http.bearer
  endpoint_profiles:
    google_sheets_default:
      base_url: https://sheets.googleapis.com
      default_headers:
        Accept: application/json
  provisioning_auth: {}
  inbound_verifiers: {}

types:
  GoogleSheetsValueInputOption:
    kind: enum
    variants: [raw, user_entered]

  GoogleSheetsSheetSummary:
    kind: object
    fields:
      sheet_id:
        type: u32
      title:
        type: string
      index:
        type: u32
        optional: true
      row_count:
        type: u32
        optional: true
      column_count:
        type: u32
        optional: true

  GoogleSheetsCreateSpreadsheetInput:
    kind: object
    fields:
      title:
        type: string
      locale:
        type: string
        optional: true
      time_zone:
        type: string
        optional: true
      initial_sheet_title:
        type: string
        optional: true
      header_row:
        type: list
        item:
          type: string

  GoogleSheetsCreateSpreadsheetOutput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      spreadsheet_url:
        type: string
        optional: true
      title:
        type: string
      sheets:
        type: list
        item:
          type: object_ref
          target: GoogleSheetsSheetSummary

  GoogleSheetsCreateSheetInput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      title:
        type: string
      index:
        type: u32
        optional: true
      row_count:
        type: u32
        optional: true
      column_count:
        type: u32
        optional: true

  GoogleSheetsCreateSheetOutput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      sheet:
        type: object_ref
        target: GoogleSheetsSheetSummary

  GoogleSheetsAppendRowInput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      sheet:
        type: string
      row:
        type: json
        escape_hatch_reason: Semantic row payloads remain handwritten while Sheets ops still need column-order alignment.
      header_row:
        type: u32
        default: 1
      value_input_option:
        type: enum_ref
        target: GoogleSheetsValueInputOption
        optional: true

  GoogleSheetsAppendRowOutput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      sheet:
        type: string
      updated_range:
        type: string
      updated_rows:
        type: u32
        optional: true
      updated_columns:
        type: u32
        optional: true
      updated_cells:
        type: u32
        optional: true
      row_index:
        type: u32
        optional: true

  GoogleSheetsUpsertAction:
    kind: enum
    variants: [inserted, updated]

  GoogleSheetsUpsertRowInput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      sheet:
        type: string
      match_on:
        type: list
        item:
          type: string
      row:
        type: json
        escape_hatch_reason: Upsert still needs handwritten row merge semantics over current sheet headers and existing row state.
      header_row:
        type: u32
        default: 1
      value_input_option:
        type: enum_ref
        target: GoogleSheetsValueInputOption
        optional: true

  GoogleSheetsUpsertRowOutput:
    kind: object
    fields:
      action:
        type: enum_ref
        target: GoogleSheetsUpsertAction
      spreadsheet_id:
        type: string
      sheet:
        type: string
      updated_range:
        type: string
      row_index:
        type: u32
        optional: true

  GoogleSheetsFindRowsInput:
    kind: object
    fields:
      spreadsheet_id:
        type: string
      sheet:
        type: string
      filters:
        type: json
        escape_hatch_reason: Row filtering stays semantic-first while the first slice keeps multi-scalar filter payloads compact.
      limit:
        type: u32
        optional: true
      header_row:
        type: u32
        default: 1

  GoogleSheetsRowMatch:
    kind: object
    fields:
      row_number:
        type: u32
      values:
        type: json
        escape_hatch_reason: Matching rows return dynamic sheet columns keyed by header names.

  GoogleSheetsFindRowsOutput:
    kind: object
    fields:
      items:
        type: list
        item:
          type: object_ref
          target: GoogleSheetsRowMatch

surfaces:
  - kind: action
    identifier: connector.google.sheets.create_spreadsheet
    name: GoogleSheetsCreateSpreadsheet
    summary: Create a spreadsheet
    input: GoogleSheetsCreateSpreadsheetInput
    output: GoogleSheetsCreateSpreadsheetOutput
    auth: google_workspace_auth
    endpoint: google_sheets_default
    effects: Effectful
    determinism: BestEffort
    resources:
      - http_write(capabilities::http::HttpWrite)
    implementation: handwritten_semantic
    contract:
      contract_id: connector.google.sheets.create_spreadsheet@1
      effect_class: Effectful
      auth_role: outbound_auth.google_workspace_auth
      minimum_scopes: [https://www.googleapis.com/auth/spreadsheets]
      response_data_policy:
        fields: [spreadsheet_id, spreadsheet_url]
        kind: json_projection
        max_bytes: 4096
      broker_abi_version: "0.1"
      semantic_effect_slots: [create_spreadsheet]
    broker_request:
      method: POST
      origin: https://sheets.googleapis.com
      path_template: /v4/spreadsheets
      static_headers:
        Accept: application/json
        Content-Type: application/json
      body:
        properties: title
        sheets: header_row
      trusted_adapter:
        trusted_adapter_id: google.sheets.create_spreadsheet.v1
        implementation_version: "1"
        implementation_hash: sha256:273c32a2a836c676333259b5d6d644c778a47dac8559afdbd5a1544d24834afd

  - kind: action
    identifier: connector.google.sheets.create_sheet
    name: GoogleSheetsCreateSheet
    summary: Add a new sheet tab to an existing spreadsheet
    input: GoogleSheetsCreateSheetInput
    output: GoogleSheetsCreateSheetOutput
    auth: google_workspace_auth
    endpoint: google_sheets_default
    effects: Effectful
    determinism: BestEffort
    resources:
      - http_write(capabilities::http::HttpWrite)
    implementation: handwritten_semantic

  - kind: action
    identifier: connector.google.sheets.append_row
    name: GoogleSheetsAppendRow
    summary: Append one semantic row to a sheet
    input: GoogleSheetsAppendRowInput
    output: GoogleSheetsAppendRowOutput
    auth: google_workspace_auth
    endpoint: google_sheets_default
    effects: Effectful
    determinism: BestEffort
    resources:
      - http_read(capabilities::http::HttpRead)
      - http_write(capabilities::http::HttpWrite)
    implementation: handwritten_semantic
    contract:
      contract_id: connector.google.sheets.append_row@1
      effect_class: Effectful
      auth_role: outbound_auth.google_workspace_auth
      minimum_scopes: [https://www.googleapis.com/auth/spreadsheets]
      response_data_policy:
        fields: [updated_cells, updated_columns, updated_range, updated_rows]
        kind: json_projection
        max_bytes: 4096
      broker_abi_version: "0.1"
      semantic_effect_slots: [append_row]
    broker_request:
      method: POST
      origin: https://sheets.googleapis.com
      path_template: /v4/spreadsheets/{spreadsheet_id}/values/{range}:append
      placeholders:
        spreadsheet_id:
          kind: input
          input_field: spreadsheet_id
        range:
          kind: input
          input_field: sheet
      query:
        insertDataOption:
          kind: static
          value: INSERT_ROWS
        valueInputOption:
          kind: input
          input_field: value_input_option
      static_headers:
        Accept: application/json
        Content-Type: application/json
      body:
        values: row
      trusted_adapter:
        trusted_adapter_id: google.sheets.append_row.v1
        implementation_version: "1"
        implementation_hash: sha256:54db6603967e1ce4e46ef45ece7bfa947c129564e40a290989fa2ae901a23966

  - kind: action
    identifier: connector.google.sheets.find_rows
    name: GoogleSheetsFindRows
    summary: Find semantic rows in a sheet by column filters
    input: GoogleSheetsFindRowsInput
    output: GoogleSheetsFindRowsOutput
    auth: google_workspace_auth
    endpoint: google_sheets_default
    effects: ReadOnly
    determinism: BestEffort
    resources:
      - http_read(capabilities::http::HttpRead)
    implementation: handwritten_semantic

  - kind: action
    identifier: connector.google.sheets.upsert_row
    name: GoogleSheetsUpsertRow
    summary: Update a matching row or append a new one
    input: GoogleSheetsUpsertRowInput
    output: GoogleSheetsUpsertRowOutput
    auth: google_workspace_auth
    endpoint: google_sheets_default
    effects: Effectful
    determinism: BestEffort
    resources:
      - http_read(capabilities::http::HttpRead)
      - http_write(capabilities::http::HttpWrite)
    implementation: handwritten_semantic
