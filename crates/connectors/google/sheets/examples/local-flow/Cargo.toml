[package]
name = "example-connector-google-sheets-local-flow"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Portable local flow example for connector_google_sheets."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["host-bundle"]
host-bundle = ["kernel-exec", "host-inproc", "connector_google_sheets/host-bundle"]
flow-registry = ["dag-core/flow-registry", "dag-macros/flow-registry"]

[dependencies]
anyhow.workspace = true
connector_google_sheets = { path = "../..", default-features = false }
connector_google_platform = { path = "../../../platform" }
connectors-std = { path = "../../../../../connectors-std" }
capabilities = { path = "../../../../../capabilities" }
dag-core = { path = "../../../../../dag-core" }
dag-macros = { path = "../../../../../dag-macros" }
host-inproc = { path = "../../../../../host-inproc", optional = true }
kernel-exec = { path = "../../../../../kernel-exec", optional = true }
kernel-plan = { path = "../../../../../kernel-plan" }
percent-encoding = "2.3"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cap-http-reqwest = { path = "../../../../../cap-http-reqwest" }
httpmock = "0.7"
tokio = { workspace = true, features = ["full"] }

[package.metadata.latticeflow]
flows = ["connector_google_sheets_local_flow"]
default_flow = "connector_google_sheets_local_flow"
