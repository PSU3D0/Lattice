connector:
  id: connector.google.gmail
  vendor: google
  family: gmail
  version: 0.1.0
  crate: connector_google_gmail
  summary: Semantic Gmail connector

profiles:
  outbound_auth:
    google_workspace_auth:
      kind: bearer
      handle_kind: http.bearer
  endpoint_profiles:
    google_gmail_default:
      base_url: https://www.googleapis.com
      default_headers:
        Accept: application/json
  provisioning_auth: {}
  inbound_verifiers: {}

types:
  GoogleGmailSendMessageInput:
    kind: object
    fields:
      to:
        type: string
      cc:
        type: string
        optional: true
      bcc:
        type: string
        optional: true
      subject:
        type: string
      text_body:
        type: string

  GoogleGmailSendMessageOutput:
    kind: object
    fields:
      id:
        type: string
      thread_id:
        type: string
        optional: true
      label_ids:
        type: list
        item:
          type: string

surfaces:
  - kind: action
    identifier: connector.google.gmail.send_message
    name: GoogleGmailSendMessage
    summary: Send one plain-text email from the authenticated mailbox
    input: GoogleGmailSendMessageInput
    output: GoogleGmailSendMessageOutput
    auth: google_workspace_auth
    endpoint: google_gmail_default
    effects: Effectful
    determinism: BestEffort
    resources:
      - http_write(capabilities::http::HttpWrite)
    implementation: handwritten_semantic
    contract:
      contract_id: connector.google.gmail.send_message@1
      effect_class: Effectful
      auth_role: outbound_auth.google_workspace_auth
      minimum_scopes: [https://www.googleapis.com/auth/gmail.send]
      response_data_policy:
        fields: [id, thread_id]
        kind: json_projection
        max_bytes: 4096
      broker_abi_version: "0.1"
      semantic_effect_slots: [send_message]
    broker_request:
      method: POST
      origin: https://gmail.googleapis.com
      path_template: /gmail/v1/users/me/messages/send
      static_headers:
        Accept: application/json
        Content-Type: application/json
      body:
        raw: text_body
      trusted_adapter:
        trusted_adapter_id: google.gmail.rfc822_message.v1
        implementation_version: "1"
        implementation_hash: sha256:5a5de77f756b49aac0fb5339bf764f9e53a9437cdc41619c2c978aa5dbb4e3fc
