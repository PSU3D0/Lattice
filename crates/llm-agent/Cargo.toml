[package]
name = "llm-agent"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "LLM agent loop and structured extraction for Lattice. Derived from rig (MIT, Playgrounds Analytics Inc.)."

[lib]
name = "llm_agent"
doctest = false

[features]
audio = []
image = []
rmcp = []
wasm = []

[dependencies]
llm-types = { path = "../llm-types" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars = "1"
futures = "0.3"
tracing.workspace = true
thiserror = "2"
bytes = "1"
http = "1"
async-stream = "0.3"
tracing-futures = "0.2"
