# Generated/consumed by ops/scripts/cloudflare-resume-proof-init.sh
# Copies this file to .wrangler/wrangler.service-binding.toml with placeholders resolved.

name = "__WORKER_NAME__"
workers_dev = true
compatibility_date = "2024-09-23"
main = "build/worker/shim.mjs"

[build]
command = "cargo install worker-build 2>/dev/null || true && worker-build --release"

# Default deployment path: alarm dispatch via service binding.
[vars]
LATTICE_RESUME_SERVICE_BINDING = "LATTICE_RESUME_SERVICE"

[[durable_objects.bindings]]
name = "FLOW_DO"
class_name = "FlowDurableObject"

[[durable_objects.bindings]]
name = "WORKSPACE_DO"
class_name = "WorkspaceDurableObject"

[[r2_buckets]]
binding = "WORKSPACE_BUCKET"
bucket_name = "__WORKER_NAME__-workspace"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FlowDurableObject", "WorkspaceDurableObject"]

[[services]]
binding = "LATTICE_RESUME_SERVICE"
service = "__WORKER_NAME__"
