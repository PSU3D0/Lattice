name = "host-workers-test"
workers_dev = true
compatibility_date = "2024-09-23"
main = "build/worker/shim.mjs"

[build]
command = "cargo install worker-build 2>/dev/null || true && worker-build --release"

# Portable defaults for deployed alarm->resume dispatch:
# - service binding dispatch keeps traffic internal to the account edge
# - set LATTICE_INTERNAL_RESUME_TOKEN as a Wrangler secret (do not commit secrets)
[vars]
LATTICE_RESUME_SERVICE_BINDING = "LATTICE_RESUME_SERVICE"

[[durable_objects.bindings]]
name = "FLOW_DO"
class_name = "FlowDurableObject"

[[durable_objects.bindings]]
name = "WORKSPACE_DO"
class_name = "WorkspaceDurableObject"

[[r2_buckets]]
binding = "WORKSPACE_BUCKET"
bucket_name = "host-workers-test-workspace"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FlowDurableObject", "WorkspaceDurableObject"]

[[services]]
binding = "LATTICE_RESUME_SERVICE"
service = "host-workers-test"

