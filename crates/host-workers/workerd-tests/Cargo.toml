[package]
name = "host-workers-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Standalone workspace - not part of parent workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["host-bundle"]
host-bundle = []
flow-registry = []

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
cap-do-workers = { path = "../../cap-do-workers" }
cap-workspace-workers = { path = "../../cap-workspace-workers" }
capabilities = { path = "../../capabilities" }
dag-core = { path = "../../dag-core" }
dag-macros = { path = "../../dag-macros" }
example-s13-github-issue-investigator = { path = "../../../examples/s13_github_issue_investigator" }
futures = "0.3"
host-inproc = { path = "../../host-inproc" }
host-workers = { path = "..", default-features = false }
humantime-serde = "1.1"
js-sys = "0.3"
kernel-exec = { path = "../../kernel-exec", default-features = false, features = ["wasm"] }
kernel-plan = { path = "../../kernel-plan" }
serde = "1.0"
serde_json = "1.0"
stdlib = { path = "../../stdlib", features = ["host-bundle"] }
worker = { version = "=0.7.4", default-features = false, features = ["http"] }
