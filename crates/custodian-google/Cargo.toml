[package]
name = "custodian-google"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Google OAuth credential custodian for Lattice Broker V1"

[dependencies]
aes = "0.8"
base64 = "0.22"
broker-core = { path = "../broker-core" }
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
broker-host = { path = "../broker-host" }
connector-spec = { path = "../connector-spec" }
connector_google_platform = { path = "../connectors/google/platform" }
provider-google = { path = "../provider-google" }
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
