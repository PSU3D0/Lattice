[package]
name = "flows-cli"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Command-line tools for authoring, validating, and running Lattice workflows."

[[bin]]
name = "flows"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.18"
dag-core = { path = "../dag-core" }
kernel-plan = { path = "../kernel-plan" }
kernel-exec = { path = "../kernel-exec" }
capabilities = { path = "../capabilities" }
cap-http-reqwest = { path = "../cap-http-reqwest" }
host-web-axum = { path = "../host-web-axum" }
host-wasmtime = { path = "../host-wasmtime" }
registry-client = { path = "../registry-client" }
connector-spec = { path = "../connector-spec" }
exporters = { path = "../exporters" }
flow-bundle = { path = "../flow-bundle" }
example-s1-echo = { path = "../../examples/s1_echo" }
example-s2-site = { path = "../../examples/s2_site" }
example-s3-branching = { path = "../../examples/s3_branching" }
example-s4-preflight = { path = "../../examples/s4_preflight" }
example-s5-unsupported-surface = { path = "../../examples/s5_unsupported_surface" }
example-s6-spill-host = { path = "../../examples/s6_spill/host" }
example-s11-lead-intake = { path = "../../examples/s11_lead_intake" }
example-s12-sheetport-quote = { path = "../../examples/s12_sheetport_quote" }
example-s13-github-issue-investigator = { path = "../../examples/s13_github_issue_investigator" }
example-connector-github-issues-local-flow = { path = "../connectors/github/issues/examples/local-flow" }
example-connector-google-sheets-local-flow = { path = "../connectors/google/sheets/examples/local-flow" }
host-inproc = { path = "../host-inproc" }
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tower = { workspace = true, features = ["make"] }
futures.workspace = true
metrics.workspace = true
metrics-util.workspace = true
reqwest = { workspace = true }
jsonwebtoken = "9"
sha2 = "0.10"
tempfile = "3.12"
percent-encoding = "2.3"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
connector_github_issues = { path = "../connectors/github/issues" }
connector_google_platform = { path = "../connectors/google/platform" }
connector_google_sheets = { path = "../connectors/google/sheets" }
connector_formualizer_sheetport = { path = "../connectors/formualizer/sheetport" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
proptest.workspace = true
httpmock = "0.7"
example-s10-multiflow-bundle = { path = "../../examples/s10_multiflow_bundle" }
