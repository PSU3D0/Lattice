name = "cap-sql-workers-d1-test"
workers_dev = true
compatibility_date = "2024-09-23"
main = "build/worker/shim.mjs"

[build]
command = "cargo install worker-build 2>/dev/null || true && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "cap-sql-workers-d1-test"
database_id = "test-d1-database"
