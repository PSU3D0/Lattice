[package]
name = "broker-workers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cloudflare Workers package for the Lattice semantic broker"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-fixtures = ["broker-core/test_fixtures"]

[dependencies]
base64 = "0.22"
broker-core = { path = "../broker-core" }
broker-host = { path = "../broker-host" }
chacha20poly1305 = "0.10"
connector-spec = { path = "../connector-spec" }
connector_google_platform = { path = "../connectors/google/platform" }
ed25519-dalek = "2"
futures.workspace = true
getrandom = { version = "0.2", features = ["js"] }
hex.workspace = true
hmac = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
worker = { version = "=0.8.1", default-features = false, features = ["d1"] }
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
custodian-google = { path = "../custodian-google" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
futures.workspace = true
rusqlite.workspace = true
