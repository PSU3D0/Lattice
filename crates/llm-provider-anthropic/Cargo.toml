[package]
name = "llm-provider-anthropic"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
description = "Anthropic Messages API provider for Lattice LLM. Derived from rig (MIT, Playgrounds Analytics Inc.)."

[lib]
name = "llm_provider_anthropic"

[dependencies]
llm-types = { path = "../llm-types" }
llm-agent = { path = "../llm-agent", features = ["image"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
futures = "0.3"
bytes = "1"
http = "1"
async-stream = "0.3"
tracing-futures = "0.2"
thiserror = "2"

[dev-dependencies]
serde_path_to_error = "0.1"
