name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise tools
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Scan for committed secrets
        run: mise run secret-scan
