[package]
name = "kernel-plan"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Flow IR validation and lowering into executable plans."

[dependencies]
dag-core = { path = "../dag-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# Cron validation for schedule entrypoints (TRIG001). Host-only by design:
# saffron must never enter the shipped wasm32 graph (host-workers routes cron
# fires by byte equality; IR is always validated host-side before deploy).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
saffron.workspace = true
