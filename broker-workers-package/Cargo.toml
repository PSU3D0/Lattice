[workspace]
resolver = "3"
exclude = [
  "crates/cap-http-workers/workerd-tests",
  "crates/processing-context/guests/pdf-extract",
]
members = [
  "crates/broker-auth",
  "crates/broker-core",
  "crates/broker-host",
  "crates/broker-workers",
  "crates/provider-google",
  "crates/jcs-canonical",
  "crates/connector-spec",
  "crates/dag-core",
  "crates/kernel-plan",
  "crates/connectors/google/platform",
  "crates/custodian-google",
]

[workspace.package]
authors = ["Lattice Authors <opensource@lattice.dev>"]
edition = "2024"
homepage = "https://github.com/psu3d0/Lattice"
license = "MIT OR Apache-2.0"
repository = "https://github.com/psu3d0/Lattice"
rust-version = "1.90"
description = "Rust workflow platform workspace"

[workspace.metadata]
msrv = "1.90"

[workspace.dependencies]
jcs-canonical = { path = "crates/jcs-canonical" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["json", "tokio", "http1"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
config = "0.14"
redis = { version = "0.32.7", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
schemars = "0.8"
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
futures-util = "0.3"
futures-timer = "3.0"
hyper = { version = "1", features = ["full"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde_with = "3"
uuid = { version = "1", features = ["v5", "serde"] }
wasmtime = { version = "=16.0.0", features = ["async"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
flate2 = "1"
hex = "0.4"
walkdir = "2"
tempfile = "3"
once_cell = "1.19"
# Cron parser for schedule triggers (impl-docs/spec/schedule-trigger.md §4).
# saffron IS the parser Cloudflare runs for Cron Triggers, so local validation
# and dev-scheduler fire times match CF by construction. crates.io 0.1.0 is the
# same code CF production pins; git-pin only if an unreleased upstream fix is
# ever needed. Host-side only: dag-macros (proc-macro), kernel-plan behind
# cfg(not(target_arch = "wasm32")), and the dev scheduler. It must never enter
# the shipped wasm32 graph — host-workers routes cron fires by byte equality.
saffron = "0.1.0"
semver = { version = "1.0", features = ["serde"] }
trybuild = "1.0"
tower = "0.4"
async-stream = "0.3"
metrics = "0.24.2"
metrics-util = "0.20"
proptest = "1.5"
wasm-bindgen-test = "0.3"
